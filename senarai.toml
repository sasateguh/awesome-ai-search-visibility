[en]
tajuk = "Awesome AI Search Visibility"
pembuka = "Open-source tools and research for generative engine optimization (GEO): being found, cited and recommended in answers from ChatGPT, Perplexity, Gemini, Claude and Google AI. Ranked by stars and recent activity, refreshed every week."

[ms]
tajuk = "Senarai Berpangkat Keterlihatan Carian AI"
pembuka = "Alat dan kajian sumber terbuka untuk pengoptimuman enjin generatif (GEO): supaya jenama ditemui, dipetik dan disyorkan dalam jawapan ChatGPT, Perplexity, Gemini, Claude dan Google AI. Dipangkat ikut bintang dan aktiviti terkini, dikemas setiap minggu."

[github]
# Deskripsi + topik repo (D38): deskripsi lulus config/gaya.toml; topik = `gilap topik --wajib awesome,awesome-list` 25 Okt
# (data GitHub; taksa dibuang). Teks awam — terbit bait-sama selepas kelulusan pemilik.
penerangan = "Ranked, weekly-updated list of open-source tools and research for generative engine optimization (GEO) and AI search visibility."
topik = ["awesome", "awesome-list", "seo", "chatgpt", "llms-txt", "ai-search", "generative-engine-optimization", "aeo", "perplexity", "ai-visibility", "answer-engine-optimization", "ai-seo"]

[pangkat]
bintang = 1.0
aktif = 1.0

[ambang]
bintang_min = 20
hari_tidak_aktif = 365

[produk]
nama = "Repx"
url = "https://repx.my"
syarat = "laman_indeks"

[cari]
had = 50
pertanyaan = [
  '"generative engine optimization"',
  '"answer engine optimization"',
  "topic:generative-engine-optimization",
  "topic:answer-engine-optimization",
  "topic:geo-optimization",
  "topic:aeo",
  "topic:llms-txt",
  "llms.txt generator",
  '"AI visibility" tracker',
  '"AI search" visibility',
]

